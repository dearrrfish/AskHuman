name: sync-my-nixpkgs

# Automatically synchronizes origin/main into origin/my-nixpkgs.
# - Fast-forwards if my-nixpkgs has no custom commits ahead of main.
# - Linearly rebases custom feature commits on top of main via git rebase --empty=drop.
# - Protects against concurrent pushes using --force-with-lease.
# - Synchronizes Git LFS objects.
# - On rebase conflict: aborts rebase, pushes origin/main to sync/main-to-my-nixpkgs,
#   creates or updates a Pull Request (with fallback Issue), and alerts the maintainer.

on:
  # Triggered by sync-upstream (on schedule, dispatch, and pushes to main) so
  # every main update flows through one entry point. workflow_dispatch remains
  # for manual recovery.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate sync without pushing to origin"
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: "Simulate sync without pushing to origin"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-my-nixpkgs:
    name: sync main -> my-nixpkgs
    runs-on: ubuntu-22.04
    concurrency:
      group: sync-branches
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: main
      TARGET_BRANCH: my-nixpkgs
      CONFLICT_BRANCH: sync/main-to-my-nixpkgs
      DRY_RUN: ${{ inputs.dry_run || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Configure Git & Fetch Branches
        id: fetch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgSign false
          git config tag.gpgSign false

          echo "Fetching source branch ($SOURCE_BRANCH) from origin..."
          git fetch --no-tags origin "$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"

          echo "Checking if target branch ($TARGET_BRANCH) exists on origin..."
          if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch $TARGET_BRANCH does not exist on origin yet."
            SOURCE_HEAD=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")
            echo "Initializing $TARGET_BRANCH from origin/$SOURCE_BRANCH ($SOURCE_HEAD)..."
            if [ "$DRY_RUN" != "true" ]; then
              git push origin "refs/remotes/origin/$SOURCE_BRANCH:refs/heads/$TARGET_BRANCH"
            else
              echo "Dry run: skipping push to origin/$TARGET_BRANCH"
            fi

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### 🌱 Branch Initialized: \`$TARGET_BRANCH\`"
                echo "- **Target Branch**: \`$TARGET_BRANCH\`"
                echo "- **Source Branch**: \`$SOURCE_BRANCH\`"
                echo "- **Commit**: \`$SOURCE_HEAD\`"
                echo "- **Status**: Initialized \`$TARGET_BRANCH\` directly from \`origin/$SOURCE_BRANCH\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "initialized=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Fetching target branch ($TARGET_BRANCH) from origin..."
          git fetch --no-tags origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "refs/remotes/origin/$TARGET_BRANCH"

      - name: Synchronize main into my-nixpkgs
        if: steps.fetch.outputs.initialized != 'true'
        run: |
          set -euo pipefail

          ORIG_TARGET_HEAD=$(git rev-parse HEAD)
          SOURCE_HEAD=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")

          echo "Target HEAD ($TARGET_BRANCH): $ORIG_TARGET_HEAD"
          echo "Source HEAD ($SOURCE_BRANCH): $SOURCE_HEAD"

          # Case 1: origin/main is already an ancestor of origin/my-nixpkgs
          if git merge-base --is-ancestor "$SOURCE_HEAD" "$ORIG_TARGET_HEAD"; then
            echo "Source branch $SOURCE_BRANCH is already an ancestor of $TARGET_BRANCH."
            if [ "$ORIG_TARGET_HEAD" = "$SOURCE_HEAD" ]; then
              echo "Branch $TARGET_BRANCH is identical to $SOURCE_BRANCH."
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                {
                  echo "### 🟢 Branch Sync: Already Up to Date"
                  echo "- **Target Branch**: \`$TARGET_BRANCH\`"
                  echo "- **Source Branch**: \`$SOURCE_BRANCH\`"
                  echo "- **Target HEAD**: \`$ORIG_TARGET_HEAD\`"
                  echo "- **Source HEAD**: \`$SOURCE_HEAD\`"
                  echo "- **Status**: Branch \`$TARGET_BRANCH\` is identical to \`$SOURCE_BRANCH\`. No sync needed."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Branch $TARGET_BRANCH has custom commits on top of $SOURCE_BRANCH."
              CUSTOM_COMMITS=$(git log --oneline "$SOURCE_HEAD..$ORIG_TARGET_HEAD")
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                {
                  echo "### 🟢 Branch Sync: Already Up to Date"
                  echo "- **Target Branch**: \`$TARGET_BRANCH\`"
                  echo "- **Source Branch**: \`$SOURCE_BRANCH\`"
                  echo "- **Target HEAD**: \`$ORIG_TARGET_HEAD\`"
                  echo "- **Source HEAD**: \`$SOURCE_HEAD\`"
                  echo "- **Status**: Source branch \`$SOURCE_BRANCH\` is already integrated into \`$TARGET_BRANCH\`. Custom feature commits are retained."
                  echo ""
                  echo "<details>"
                  echo "<summary>Custom commits ahead of source branch</summary>"
                  echo ""
                  echo '```'
                  echo "$CUSTOM_COMMITS"
                  echo '```'
                  echo "</details>"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit 0
          fi

          # Case 2: origin/my-nixpkgs is an ancestor of origin/main (clean fast-forward)
          if git merge-base --is-ancestor "$ORIG_TARGET_HEAD" "$SOURCE_HEAD"; then
            echo "Branch $TARGET_BRANCH can be cleanly fast-forwarded to $SOURCE_BRANCH."
            git merge --ff-only "$SOURCE_HEAD"
            git lfs fetch origin "$SOURCE_HEAD" || true

            INTEGRATED_COMMITS=$(git log --oneline "$ORIG_TARGET_HEAD..$SOURCE_HEAD")

            if [ "$DRY_RUN" != "true" ]; then
              echo "Pushing fast-forwarded $TARGET_BRANCH to origin..."
              git push origin "HEAD:refs/heads/$TARGET_BRANCH"
              git lfs push origin --all || true
            else
              echo "Dry run: skipping push to origin/$TARGET_BRANCH"
            fi

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### 🚀 Branch Sync: Fast-Forward Successful"
                echo "- **Target Branch**: \`$TARGET_BRANCH\`"
                echo "- **Source Branch**: \`$SOURCE_BRANCH\`"
                echo "- **Previous HEAD**: \`$ORIG_TARGET_HEAD\`"
                echo "- **New HEAD**: \`$SOURCE_HEAD\`"
                echo "- **Mode**: Fast-Forward"
                echo ""
                echo "<details open>"
                echo "<summary>Commits integrated from source branch</summary>"
                echo ""
                echo '```'
                echo "$INTEGRATED_COMMITS"
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # Case 3: Diverged branches (custom feature commits on my-nixpkgs and new commits on main)
          MERGE_BASE=$(git merge-base "$ORIG_TARGET_HEAD" "$SOURCE_HEAD")
          MAIN_COMMITS=$(git log --oneline "$MERGE_BASE..$SOURCE_HEAD")
          CUSTOM_COMMITS=$(git log --oneline "$MERGE_BASE..$ORIG_TARGET_HEAD")

          echo "Branches diverged at $MERGE_BASE."
          echo "Attempting git rebase --empty=drop onto $SOURCE_HEAD..."

          if git rebase --empty=drop "$SOURCE_HEAD"; then
            # Subcase 3a: Rebase succeeded cleanly
            NEW_HEAD=$(git rev-parse HEAD)
            echo "Rebase succeeded cleanly! New HEAD: $NEW_HEAD"
            git lfs fetch origin "$SOURCE_HEAD" || true
            REBASED_COMMITS=$(git log --oneline "$SOURCE_HEAD..$NEW_HEAD")

            if [ "$DRY_RUN" != "true" ]; then
              echo "Pushing rebased $TARGET_BRANCH with --force-with-lease..."
              git push --force-with-lease="refs/heads/$TARGET_BRANCH:$ORIG_TARGET_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
              git lfs push origin --all || true
            else
              echo "Dry run: skipping push to origin/$TARGET_BRANCH"
            fi

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### 🔄 Branch Sync: Rebase Successful"
                echo "- **Target Branch**: \`$TARGET_BRANCH\`"
                echo "- **Source Branch**: \`$SOURCE_BRANCH\`"
                echo "- **Merge Base**: \`$MERGE_BASE\`"
                echo "- **Source HEAD**: \`$SOURCE_HEAD\`"
                echo "- **Previous Target HEAD**: \`$ORIG_TARGET_HEAD\`"
                echo "- **New Target HEAD**: \`$NEW_HEAD\`"
                echo "- **Mode**: Linear Rebase (--empty=drop, --force-with-lease)"
                echo ""
                echo "<details open>"
                echo "<summary>Source commits integrated</summary>"
                echo ""
                echo '```'
                echo "$MAIN_COMMITS"
                echo '```'
                echo "</details>"
                echo ""
                echo "<details open>"
                echo "<summary>Custom commits retained after rebase</summary>"
                echo ""
                echo '```'
                echo "$REBASED_COMMITS"
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          else
            # Subcase 3b: Rebase conflict
            echo "::error::Rebase failed with conflicts."
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U || true)
            if [ -z "$CONFLICTED_FILES" ]; then
              CONFLICTED_FILES=$(git status --porcelain | awk '/^[UDA]{2}/ {print $2}' || true)
            fi

            echo "Aborting rebase and resetting to original target HEAD..."
            git rebase --abort || true
            git reset --hard "$ORIG_TARGET_HEAD"

            BODY_FILE=$(mktemp)
            {
              echo "An automated rebase of custom commits on \`$TARGET_BRANCH\` onto \`$SOURCE_BRANCH\` encountered merge conflicts."
              echo ""
              echo "### Conflict Details"
              echo "- **Source Branch**: \`$SOURCE_BRANCH\` (\`$SOURCE_HEAD\`)"
              echo "- **Target Branch**: \`$TARGET_BRANCH\` (\`$ORIG_TARGET_HEAD\`)"
              echo "- **Conflict Branch**: \`$CONFLICT_BRANCH\`"
              echo ""
              echo "### Conflicted Files"
              echo '```'
              echo "$CONFLICTED_FILES"
              echo '```'
              echo ""
              echo "### Custom Commits on \`$TARGET_BRANCH\`"
              echo '```'
              echo "$CUSTOM_COMMITS"
              echo '```'
              echo ""
              echo "### Incoming Commits from \`$SOURCE_BRANCH\`"
              echo '```'
              echo "$MAIN_COMMITS"
              echo '```'
              echo ""
              echo "### Manual Resolution Instructions"
              echo "To resolve this locally:"
              echo '```bash'
              echo "git fetch origin"
              echo "git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH"
              echo "git rebase origin/$SOURCE_BRANCH"
              echo "# Resolve conflicts in your editor, then:"
              echo "git add <conflicted-files>"
              echo "git rebase --continue"
              echo "# Push rebased $TARGET_BRANCH to origin:"
              echo "git push --force-with-lease origin $TARGET_BRANCH"
              echo "# Clean up conflict branch if desired:"
              echo "git push origin --delete $CONFLICT_BRANCH"
              echo '```'
            } > "$BODY_FILE"

            if [ "$DRY_RUN" != "true" ]; then
              echo "Pushing source HEAD to origin/$CONFLICT_BRANCH..."
              git push origin "+$SOURCE_HEAD:refs/heads/$CONFLICT_BRANCH"

              echo "Checking for existing PR from $CONFLICT_BRANCH to $TARGET_BRANCH..."
              PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CONFLICT_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)

              PR_ACTION_DONE=false
              if [ -n "$PR_NUM" ]; then
                echo "Updating existing PR #$PR_NUM..."
                if gh pr edit "$PR_NUM" --repo "$GITHUB_REPOSITORY" --title "chore(sync): resolve conflict syncing $SOURCE_BRANCH into $TARGET_BRANCH" --body-file "$BODY_FILE"; then
                  PR_ACTION_DONE=true
                fi
              else
                echo "Creating new PR for conflict resolution..."
                if gh pr create --repo "$GITHUB_REPOSITORY" --head "$CONFLICT_BRANCH" --base "$TARGET_BRANCH" --title "chore(sync): resolve conflict syncing $SOURCE_BRANCH into $TARGET_BRANCH" --body-file "$BODY_FILE"; then
                  PR_ACTION_DONE=true
                fi
              fi

              if [ "$PR_ACTION_DONE" != "true" ]; then
                echo "PR action could not be completed. Falling back to GitHub Issue..."
                ISSUE_NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"[Branch Sync]\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
                if [ -n "$ISSUE_NUM" ]; then
                  echo "Commenting on existing issue #$ISSUE_NUM..."
                  gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE" || true
                else
                  echo "Creating new issue for conflict notification..."
                  gh issue create --repo "$GITHUB_REPOSITORY" --title "[Branch Sync] Rebase conflict syncing $SOURCE_BRANCH into $TARGET_BRANCH" --body-file "$BODY_FILE" || true
                fi
              fi
            else
              echo "Dry run: skipping push to origin/$CONFLICT_BRANCH and PR/Issue creation."
            fi
            rm -f "$BODY_FILE"

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### ❌ Branch Sync: Rebase Conflict"
                echo "An automated rebase of \`$TARGET_BRANCH\` onto \`$SOURCE_BRANCH\` failed due to merge conflicts."
                echo ""
                echo "- **Source Branch**: \`$SOURCE_BRANCH\` (\`$SOURCE_HEAD\`)"
                echo "- **Target Branch**: \`$TARGET_BRANCH\` (\`$ORIG_TARGET_HEAD\`)"
                echo "- **Conflict Branch**: \`$CONFLICT_BRANCH\`"
                echo ""
                echo "#### Conflicted Files"
                echo '```'
                echo "$CONFLICTED_FILES"
                echo '```'
                echo ""
                echo "#### Custom Commits"
                echo '```'
                echo "$CUSTOM_COMMITS"
                echo '```'
                echo ""
                echo "#### Manual Resolution Instructions"
                echo '```bash'
                echo "git fetch origin && git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH && git rebase origin/$SOURCE_BRANCH"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            exit 1
          fi
